version: 1
strategies:
  - id: static_option_a
    display_name: Static Option A
    method_citation_id: brinson_hood_beebower_1986_policy
    method_citation: "Brinson, Gary P., L. Randolph Hood, and Gilbert L. Beebower. 1986. \"Determinants of Portfolio Performance.\" Financial Analysts Journal 42(4): 39-44. doi:10.2469/faj.v42.n4.39. Used here as a policy/benchmark baseline, not as a predictive strategy paper."
    entrypoint: usa_etf_features.strategy_registry:static_option_a
    default_params:
      weights:
        VOO: 0.70
        QQQM: 0.20
        IJR: 0.10
    enabled: true
  # Unconditional VT null — disabled, for Quant audit only.
  # Preserves the primary null (Sharpe_rf0 ≈ 1.059 / MaxDD ≈ −20.1%) so the
  # Justina #6 gate-first overlay claim remains checkable.
  # Artifact: data/processed/vol_target_oos_{returns,summary}.csv
  # Do NOT enable as a live shortlist book.
  - id: vol_target_option_a_uncond
    display_name: "Unconditional Vol-Target Option A (Quant audit null — NOT a live book)"
    method_citation_id: moreira_muir_2017_vol_managed
    method_citation: >-
      Moreira, Alan, and Tyler Muir. 2017. "Volatility-Managed Portfolios."
      Journal of Finance 72(4): 1611-1644. doi:10.1111/jofi.12513.
      Unconditional VT null for Justina #6 skewness overlay audit.
      OOS reference: Sharpe_rf0 ≈ 1.059, MaxDD ≈ −20.1%, 68 months.
      Do NOT promote to live shortlist — use vol_target_option_a (VT × gate-first).
    entrypoint: usa_etf_features.strategy_registry:vol_target_option_a
    default_params:
      core: option_a
      lookback: 63
      f_min: 0.25
      f_max: 1.0
      sigma_star: expanding_annvol
      cash_ticker: BIL
      cost_bps_one_way: 5.0
    enabled: false

  - id: vol_target_option_a
    display_name: "Vol Target Option A (Book-2 — VT × skewness gate)"
    method_citation_id: moreira_muir_2017_vol_managed_gong_lynch_ogden_2025
    method_citation: >-
      Moreira, Alan, and Tyler Muir. 2017. "Volatility-Managed Portfolios."
      Journal of Finance 72(4): 1611-1644. doi:10.1111/jofi.12513.
      Skewness/left-tail gate overlay (Justina #6): Gong, Rui, John Lynch,
      and Richard Ogden. 'Skewness Managed Portfolios.' Working paper (Jan 2025
      / Jul 2026). https://richardeogden.github.io/Skewness_Managed_Portfolios.pdf
      Gate: f̃_t = f_t · g_t; residual → BIL. Gate-first knobs locked:
      lookback=63, skew_estimator=realized_amaya, left_tail_rule=cvar_5,
      g_min=0.5. Skew measurement: Amaya et al. 2015 JFE 118:135-167.
    entrypoint: usa_etf_features.strategy_registry:vol_target_book2
    default_params:
      core: option_a
      lookback: 63
      f_min: 0.25
      f_max: 1.0
      g_min: 0.5
      sigma_star: expanding_annvol
      skew_estimator: realized_amaya
      left_tail_rule: cvar_5
      skew_lookback_months: 21
      apply_to: option_a_vt
      cash_ticker: BIL
      cost_bps_one_way: 5.0
      min_names: 100
      include_thin: false
      cov_lookback_months: 36
      max_null_names_cov: 50
      monthly_csv: data/raw/usa_universe_panel_monthly_returns.csv
      coverage_csv: data/raw/usa_universe_panel_history_coverage.csv
    enabled: true
  - id: score_rotate_xsd
    display_name: ScoreSimple XSD Rotate
    method_citation_id: xsd_rotation_memo_2026_09_16
    method_citation: "Jegadeesh, Narasimhan, and Sheridan Titman. 1993. \"Returns to Buying Winners and Selling Losers: Implications for Stock Market Efficiency.\" Journal of Finance 48(1): 65-91. doi:10.1111/j.1540-6261.1993.tb04702.x; Harvey, Campbell R., Edward Hoyle, Russell Korgaonkar, Sandy Rattray, Matthew Sargaison, and Otto van Hemert. 2018. \"The Impact of Volatility Targeting.\" Journal of Portfolio Management 45(1): 14-33. doi:10.3905/jpm.2018.45.1.014. Implemented per /workspace/investments/xsd_rotation_memo.md as Mom12_1 vs VOO plus expanding vol gate through t-1."
    entrypoint: usa_etf_features.strategy_registry:score_rotate_xsd
    default_params:
      rotate_eligible: [XSD]
      benchmark: VOO
      use_vol_gate: true
      hysteresis_months: 2
    enabled: true
  - id: m3_p2_core_rotate
    display_name: M3 P2 Core Rotate
    method_citation_id: wf_optimization_memo_2026_09_16_p2
    method_citation: "Markowitz, Harry. 1952. \"Portfolio Selection.\" Journal of Finance 7(1): 77-91. doi:10.1111/j.1540-6261.1952.tb01525.x; Ledoit, Olivier, and Michael Wolf. 2004. \"A Well-Conditioned Estimator for Large-Dimensional Covariance Matrices.\" Journal of Multivariate Analysis 88(2): 365-411. doi:10.1016/S0047-259X(03)00096-4. Implemented per /workspace/investments/wf_optimization_memo.md as P2 hierarchy: core >= 60%, ScoreSimple-gated thematic satellites may go to 0."
    entrypoint: usa_etf_features.strategy_registry:m3_p2_core_rotate
    default_params:
      optimizer: P2
      window_months: 36
      min_history_months: 36
      top_n: 6
      benchmark: VOO
    enabled: true
  - id: spectral_risk_parity
    display_name: Experimental Spectral Risk Parity
    method_citation_id: adia_spectral_rp_2026_agp_1610_08818
    method_citation: "ADIA Lab, Spectral Risk Parity (2026), https://www.adialab.ae/research-series/spectral-risk-parity; Benichou et al., Agnostic Risk Parity (Eigenrisk Parity), arXiv:1610.08818, https://arxiv.org/abs/1610.08818. Experimental teaching-note mapping, not an exact replication."
    entrypoint: usa_etf_features.strategy_registry:spectral_risk_parity
    default_params:
      returns_csv: data/raw/usa_universe_panel_monthly_returns.csv
      coverage_csv: data/raw/usa_universe_panel_history_coverage.csv
      lookback: 60
      gamma: 1.0
      mp_rule: unit
      mode: name
      include_thin: false
      min_names: 100
      adv_min: 0.0
      cost_bps: 5.0
  - id: regime_aware_dual_regime
    display_name: Regime-Aware Dual-Regime
    method_citation_id: luo_mulvey_2026_regime_aware_jfds
    method_citation: 'Yirui Luo and John M. Mulvey. 2026. "Regime-Aware Asset Allocation with Dual-Regime Signals and Regime-Dependent Asset Selection." Journal of Financial Data Science 8(3): 104-134. https://www.pm-research.com/content/iijjfds/8/3/104 ; blueprint: Shu, Yu, and Mulvey. 2024. "Dynamic Asset Allocation with Asset-Specific Regime Forecasts." arXiv:2406.09578. Research implementation on category sleeves; not investment advice.'
    entrypoint: usa_etf_features.strategy_registry:regime_aware_dual_regime
    default_params:
      k: 2
      fit_mode: expanding
      min_history_months: 36
      feature_set: vol_corr_spread
      allocator: erc
      name_level: false
      vol_window: 6
      corr_window: 12
    enabled: true

  - id: vol_cond_factor_corr
    display_name: Vol-Managed + Conditional Factor Correlations
    method_citation_id: demiguel_martin_utrera_uppal_2024_jofi_13395
    method_citation: "DeMiguel, Victor, Alberto Martín-Utrera, and Raman Uppal. 2024. \"A Multifactor Perspective on Volatility-Managed Portfolios.\" Journal of Finance 79(6): 3859-3891. doi:10.1111/jofi.13395 (JOFI 13395). Book-2 upgrade: conditional correlation/vol-state gate on Moreira–Muir / target-vol Option A (Moreira & Muir 2017, doi:10.1111/jofi.12513). Research mapping on ETF category sleeves; not investment advice."
    entrypoint: usa_etf_features.strategy_registry:vol_cond_factor_corr
    default_params:
      core: option_a
      lookback: 63
      corr_lookback_months: 12
      f_min: 0.25
      f_max: 1.0
      g_min: 0.5
      z_rule: mkt_vol
      apply_to: option_a_vt
      sigma_star: expanding_annvol
      cash_ticker: BIL
      cost_bps_one_way: 5.0
      include_thin: false
      monthly_csv: data/raw/usa_universe_panel_monthly_returns.csv
      coverage_csv: data/raw/usa_universe_panel_history_coverage.csv
    enabled: true
  - id: forecast_tangency_med
    display_name: Forecast Tangency + MED (Archive/Methods stub — Quant gate pending)
    method_citation_id: alexander_scherer_2023_ft_med_engproc
    method_citation: "Alexander, Nolan, and William Scherer. 2023. 'Forecasting Tangency Portfolios and Investing in the Minimum Euclidean Distance Portfolio to Maximize Out-of-Sample Sharpe Ratios.' Engineering Proceedings 39(1):34. doi:10.3390/engproc2023039034. arXiv:2604.03948. Nulls: EW + LW MinVar + ERC (CIO gate, required) + LW MVO (diagnostic). DSR + trial_count mandatory (Bailey & Lopez de Prado 2014). v1: long-only, leverage_cap=1.0, 5 bps one-way, rf=0 Sharpe_rf0. NO book cut until Quant gate PASS."
    entrypoint: usa_etf_features.strategy_registry:forecast_tangency_med
    default_params:
      ef_lookback_months: 21
      forecast_lookback_months: 60
      mu_estimator: sample
      cov_estimator: ledoit_wolf
      long_only: true
      leverage_cap: 1.0
      cost_bps_one_way: 5.0
      cash_ticker: BIL
      min_names: 100
      apply_to: name_level
      include_thin: false
      min_history_months: 24
      monthly_csv: data/raw/usa_universe_panel_monthly_returns.csv
      coverage_csv: data/raw/usa_universe_panel_history_coverage.csv
    enabled: false

  - id: regime_resilient_erc
    display_name: Regime-Resilient ERC (Archive/Methods stub — Quant gate pending)
    method_citation_id: ielpo_muhammetgulyyeva_royer_2026_jpm_52_9_regime_resilient_erc
    method_citation: "Ielpo, Florian, Selbi Muhammetgulyyeva, and Julien Royer. 2026. 'Building a Regime-Resilient ERC Portfolio.' Journal of Portfolio Management 52(9):189-213. doi:10.3905/jpm.2026.030. Precursor: LOIM MARS, Dec 2023 (same authors). Classical ERC: Maillard, Roncalli & Teiletche (2010), JPM 36(4):60-70. Nulls: unconditional ERC (PRIMARY), EW, LW MinVar. DSR + trial_count mandatory (Bailey & Lopez de Prado 2014). Construction overlays only (stress/corr + LOIM regime-parity π-blend) — NOT dual-regime asset selection (archived #2). NO book cut until Quant gate PASS."
    entrypoint: usa_etf_features.strategy_registry:regime_resilient_erc
    default_params:
      construction: stress_corr_overlay
      stress_window_months: 12
      mix_lambda: 0.25
      corr_breakdown_gate: false
      regime_pool_rule: rolling_vol_split
      n_regimes: 2
      pi_rule: historical_freq
      min_obs_per_pool: 24
      cov_estimator: ledoit_wolf
      long_only: true
      cost_bps_one_way: 5.0
      cash_ticker: BIL
      min_names: 100
      apply_to: name_level
      include_thin: false
      min_history_months: 36
      monthly_csv: data/raw/usa_universe_panel_monthly_returns.csv
      coverage_csv: data/raw/usa_universe_panel_history_coverage.csv
    enabled: false
