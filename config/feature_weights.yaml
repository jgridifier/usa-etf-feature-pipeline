# Composite score weights (sum = 1.0). Higher Mom / Quality / Liquidity better;
# Vol and MaxDD enter as inverted signals (-Vol, -MaxDD) before z-scoring.
weights:
  mom12_1: 0.30
  quality_v1: 0.25
  neg_vol_252: 0.15
  neg_maxdd_252: 0.15
  liquidity_adv: 0.10
  neg_vol_63: 0.05

quality:
  benchmark: VOO
  fallback_benchmark: VTI
  lookback: 252
  lambda_er: 1.0

volatility:
  windows: [63, 252]
  annualization: 252
  ddof: 1

momentum:
  # Product of monthly returns lag 12 .. lag 2 (inclusive); skip lag 1
  lag_start: 2
  lag_end: 12

maxdd:
  lookback: 252

liquidity:
  lookback: 21

robust_z:
  mad_scale: 1.4826
