name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The job id/name "test" is the required status check on main (repository ruleset).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      # Node lets tests/test_explorer_pages.py::test_explorer_numerics run instead of skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Full suite on committed data only: no data downloads, no Pages build.
      - name: pytest
        run: python -m pytest -q -rs
      - name: Explorer numerics (node)
        run: node tests/explorer_numerics.cjs
