# Pre-registration: Bet 1 anchored EPO allocator (research only; registry enabled:false).
# Locked before the gate run. The SHA-256 of this file's exact bytes is pinned in
# src/usa_etf_features/epo_allocator.py (PREREG_SHA256) and in tests. The gate script refuses to
# run if this file changes or the git working tree is dirty. A changed file is NOT a new
# pre-registration: any change needs a new ticket and adds trials.
gate_id: epo_anchored_trend
ticket: /workspace/investments/justina_shortlist/ENGINEERING_TICKET_epo_allocator.md (incl. addendum 2026-09-30)
teaching_note: /workspace/investments/methods/allocation_alpha_epo.html
registered: 2026-09-30
registered_by: Quant (ticket), CIO (conditions and approved defaults), CoS (lock)
rulings: "Quant + CIO rulings of 2026-09-30 on the six PR #43 judgment calls are recorded below (asset_class, costs, book_eligibility, gate.c6, signal, book_eligibility windows). All six are resolved."

method_constraint:
  rule: "Statistical or classical ML only; no large pretrained models and no model downloads (Jared, standing rule for this track)."
  compliance: "Anchored EPO is a closed-form statistical optimizer solved as a long-only QP (numpy/scipy). No pretrained models, no downloads."

method:
  name: "Anchored Enhanced Portfolio Optimization (Pedersen, Babu & Levine 2021, FAJ 77(2) 124-151, eqs. 19, 21, 22, 23; template 'Equity 7')"
  anchor: "inverse volatility: a_i = (1/sigma_i) / sum_j (1/sigma_j)"
  covariance: "156 weekly returns ending at the last weekly row on or before month-end t-1; sigma = sqrt(52) * std; Omega_tilde = 0.95 * sample correlation + 0.05 * I; Sigma_tilde = sigma Omega_tilde sigma; V = diag(sigma^2); Sigma_w = (1-w) Sigma_tilde + w V"
  gamma: "eq. 21: sqrt(s' Sigma_w^-1 Sigma_tilde Sigma_w^-1 s) / sqrt(a' Sigma_tilde a); if s = 0 for every name, hold the anchor and log the month"
  long_only_projection: "max x' mu_tilde - (gamma/2) x' Sigma_w x, mu_tilde = (1-w) s + gamma w V a, s.t. sum(x) = 1, 0 <= x <= 1; SLSQP with the LW MinVar null's settings and an analytic gradient; solver status and KKT residual recorded; the unconstrained closed form is diagnostic only"
  w_grid:
    primary: 0.75
    sensitivities: [0.50, 0.90]
    anchor_comparison: 1.00   # anchored EPO at w=1 is the 1/sigma anchor itself; a named comparison, not a trial
  other_values_allowed: false  # no other w, window, signal (incl. 12-0) or anchor without a new ticket

signal:
  name: "12-1 trend, excess of BIL (Baltussen, Swinkels & van Vliet 2021, JFE 142(3) 1128-1154)"
  definition: "for holding month t: mom_i = prod_{k=t-12}^{t-2} (1 + r_ik - rf_k) - 1 (11 months, skipping month t-1); rf = gate_metrics.risk_free_monthly (BIL, TB3MS before BIL's first full month); s_i = 0.1 * sigma_i * sign(mom_i), sign(0) = 0"
  final: true
  twelve_zero: "12-0 (the paper's no-skip signal) is NOT a sensitivity and will not be run. 12-1 is final (ruling 5)."

universe:
  tag: epo_universe            # stored boolean column in data/raw/usa_universe_categorized.csv
  count: 135
  equity_only: 96              # every equity_only name
  added: 39
  added_tickers: [AGG, BND, BNO, CANE, CORN, EMLC, GLD, GOVT, GSG, HYD, IAU, IAUM, IEF, IEI, ILTB, ISTB, JNK, LEMB, MBB, MUB, NYF, PALL, PPLT, SCHP, SJNK, SLV, SOYB, SPHD, TAGS, TIP, TLT, UGA, UNG, USL, USO, VCIT, VCSH, VT, WEAT]
  exclusions:
    - "every cash_like, short_duration and near_cash name (CIO-approved default)"
    - "Category in {Defined Outcome / Buffer / Structured, Crypto / Digital Assets}"
    - "Innovator option-overlay products filed under other categories: APRH APRJ JAJL JANH JANJ JULH JULJ OCTH OCTJ QTAP QTJL QTOC SFLR SPUT TFJL XBJA XDQQ XDSQ XTAP XTJA XTJL XTOC XUSP KMAY RFLR"
    - "VIXY"
    - "the 23 non-equity rows whose Name_Raw is only 'ETF <ticker>' (unverified exposure): AAAU GBND GCAL GCOR GEMD GHYB GIGB GIGL GIND GINN GMNY GMUB GPIQ GPRF GSC GSEU GSEW GSJY GTEK GTIP GVIP GVUS GXUS"
    - "TRTY (fund of funds; holdings cannot be looked through)"
  eligibility: "at month-end t-1: epo_universe; 156 complete weekly returns ending at the last weekly row on or before month-end t-1; monthly returns for t-12..t-1; >= 60 monthly returns"
  name_floor: 100              # months below the floor are skipped and listed

asset_class:
  source: "stored column epo_asset_class in data/raw/usa_universe_categorized.csv; never inferred from Category (known mislabels)"
  rule: "the 96 equity_only names are equity; each of the 39 added funds carries an explicit tag (ruling 1: VT and SPHD are equity)"
  counts: {epo_universe: 135, equity: 98, bond: 20, commodity: 17}
  added_39_split: {bond: 20, commodity: 17, bond_or_commodity: 37, equity: 2}
  bond: [AGG, BND, EMLC, GOVT, HYD, IEF, IEI, ILTB, ISTB, JNK, LEMB, MBB, MUB, NYF, SCHP, SJNK, TIP, TLT, VCIT, VCSH]
  commodity: [BNO, CANE, CORN, GLD, GSG, IAU, IAUM, PALL, PPLT, SLV, SOYB, TAGS, UGA, UNG, USL, USO, WEAT]
  equity_among_added: [SPHD, VT]

window:
  panel: "monthly_panel.load_monthly_panel('data/raw/usa_universe_panel_monthly_returns.csv') (complete calendar months only; PanelProvenance kept); weekly panel cut to rows on or before the last complete month-end; no hard-coded end month"
  oos: "first weights at month-end 2016-10 (applied to 2016-11) through the last complete month; monthly rebalance; signal and covariance dated t-1, weights earn month t"
  subperiod: "2021-02 onward, reported, not a trial"

costs:
  primary: "turnover = 0.5 * ||w_t - w_drift||_1 against drifted weights (previous target drifted by realized returns); 5 bp one-way on this turnover for every strategy, including the Book 1 rebuild (ruling 2)"
  diagnostic: "turnover_target = 0.5 * ||w_t - w_{t-1}||_1 against the previous target weights (the #34/#37/#40 model); reported only"
  stress: "10 and 25 bp cost stress are diagnostics only"

nulls:
  primary: "weekly Ledoit-Wolf (2004) long-only MinVar, 156 weeks (lw_minvar_156w)"
  others: ["anchor_ivol (anchored EPO at w=1)", "trend_ivol (s_i > 0 names at inverse-vol weights, renormalized; anchor if none)", "equal_weight", "erc (LW covariance)"]
  reference: "Book 1 static_option_a, VOO/QQQM/IJR 70/20/10, rebuilt from the monthly panel as a monthly-rebalanced mix net of the same 5 bp drifted-turnover cost model (reference only, for book eligibility)"
  book1_published_reference: "the published gross Book 1 series (r_option_a in data/processed/vol_target_oos_returns.csv) is printed as a reference line only, on its months within the OOS window; never used for eligibility (ruling 3)"
  rule: "same eligible names, rebalance dates, bounds and costs as the method"

trial_count: 11                # 8 carried forward + 3 (w = 0.50, 0.75, 0.90); DSR at N = 11 with registry cross-trial variance

gate:   # Quant decides; decided against the primary null; applies to w = 0.75, net of 5 bp
  c1: "Sharpe_exBIL > LW MinVar's with LW2008 one-sided p <= 0.05 on BOTH HAC (QS, prewhitened) and studentized circular block bootstrap (b = 4, B >= 5000)"
  c2: "Sharpe_exBIL >= anchor_ivol's (point estimate)"
  c3: "Sharpe_exBIL >= equal_weight's and trend_ivol's (point estimates)"
  c4: "DSR >= 0.95 at N = 11"
  c5: "w = 0.50 and w = 0.90 both have Sharpe_exBIL > LW MinVar's (direction)"
  c6: "tripwires: composition computable and <= 50% for method and primary null (limit stays 50%, ruling 4; the observed shares are printed; expected 0.00%); method ticker effective N >= 5 (method only; the null's effective N is a diagnostic); failure is VOID"
  label_order: "gate_metrics.final_gate_label: VOID wins; FAIL stays FAIL; not computable turns a would-be PASS into INCOMPLETE"

book_eligibility:   # separate from the gate label; eligible=true requires label PASS (writer-enforced)
  book1_window: "overlap months only: QQQM's first full month (2020-11) through the last OOS month; the method is restricted to exactly the same months; net vs net (ruling 6)"
  book1_rule: "method (w = 0.75) beats the rebuilt net Book 1 on Sharpe_exBIL or on MaxDD (shallower), point estimates, on the overlap months; LW2008 p vs Book 1 informational (ruling 3)"
  anchor_window: "full OOS window (ruling 6)"
  month_counts: "the report prints both the overlap month count and the full OOS month count (118 on the pre-refresh panel, 119 after the September 2026 refresh)"
  cio_condition_1_anchor: "beats the anchor means the w = 0.75 point estimate of Sharpe_exBIL is strictly greater than the 1/sigma anchor's (anchored EPO at w = 1) over the full OOS window. The LW2008 p-value vs the anchor is a diagnostic only. Required for book eligibility; does not change the gate label."
  cio_condition_2_asset_mix: "print the average OOS weight by asset class (equity, bond, commodity; from epo_asset_class) for the method, the primary null and the anchor. If the method's average equity share is under 50%, book_eligible = no with reason 'growth-mandate fit'. Not a VOID."
  rule: "book_eligible = label PASS AND beats anchor AND beats Book 1 (Sharpe_exBIL or MaxDD) AND method equity share >= 50%; otherwise research-only. Mapping a PASS to a book is the CIO's call. No third book."

no_reruns: "A modest edge that reads not significant is recorded as not significant. No reruns, retuning or re-selection to chase significance. Any preview or re-run adds a trial and is listed in the registry."
